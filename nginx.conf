# /etc/nginx/nginx.conf
user  nginx;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # WebSocket: Connection header según Upgrade (HTTP normal → close; upgrade → upgrade)
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml;
  gzip_min_length 1024;

  client_max_body_size 50M;

  # Teselas para mapas de Metabase. OSM.org volunteer tiles (tile.openstreetmap.org)
  # devuelven 403 a Metabase (política de uso). Proxy + cache hacia CARTO Positron.
  proxy_cache_path /var/cache/nginx/map_tiles levels=1:2 keys_zone=map_tiles:16m
                   max_size=512m inactive=14d use_temp_path=off;

  # --- Upstreams (name = service from docker-compose) ---
  upstream wardrive_upstream {
    server wardrive:8000;
    keepalive 32;
  }

  upstream metabase_upstream {
    server wardrive_bi:3000;
    keepalive 16;
  }

  # upstream ctf_upstream (CTFd — deprecated, reemplazado por wardrive-frontend)
  # server ctfd_platform:8000;
  upstream frontend_upstream {
    server wardrive-frontend:80;
    keepalive 16;
  }

  upstream analytics_upstream {
    server analytics:3000;
    keepalive 8;
  }

  upstream minio_upstream {
    server minio:9000;
    keepalive 8;
  }

  server {
    listen 8000;
    server_name _;
    client_max_body_size 500M;
    error_log /var/log/nginx/error.log info;
    access_log /var/log/nginx/access.log combined;

    # ---- Static Wardrive (Django): desde MinIO (bucket wardrive-storage, prefijo static/) ----
    location /static-wardrive/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_pass http://minio_upstream/wardrive-storage/static/;
      access_log off;
      expires 30d;
      add_header Cache-Control "public, immutable";
    }
    location /wardriving/static-wardrive/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_pass http://minio_upstream/wardrive-storage/static/;
      access_log off;
      expires 30d;
      add_header Cache-Control "public, immutable";
    }

    # ---- Media (filesystem): use this when USE_S3_STORAGE=false ----
    #location /media/ {
    #  alias /media/;
    #  access_log off;
    #  expires 7d;
    #  add_header Cache-Control "public";
    #}
    # ---- Media (S3/MinIO): when USE_S3_STORAGE=true ----
     location /media/ {
       proxy_set_header Host $host;
       proxy_set_header X-Real-IP $remote_addr;
       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       proxy_set_header X-Forwarded-Proto $scheme;
       proxy_http_version 1.1;
       proxy_buffering off;
       proxy_request_buffering off;
       proxy_pass http://minio_upstream/media/;
       access_log off;
       expires 7d;
       add_header Cache-Control "public";
    }

    # ---- wardrive-frontend (React SPA bajo /ctf/) ----
    location = /ctf {
      return 301 /ctf/;
    }

    location /ctf/ {
      proxy_set_header Host              $http_host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_http_version 1.1;
      proxy_read_timeout 60;
      proxy_send_timeout 60;
      proxy_redirect off;

      proxy_pass http://frontend_upstream;
    }
    # ---- Guard rails admin Django bajo prefijo ----
    location = /wardriving/admin {
      return 301 /wardriving/admin/;
    }

    # El formulario de login de Django puede usar action /admin/login/ aun bajo prefijo.
    # 308 preserva método/body para que el POST de credenciales no se pierda.
    # No redirigimos todo /admin/ para no romper Metabase (/admin/settings, etc).
    location = /admin/login/ {
      return 308 /wardriving/admin/login/$is_args$args;
    }

    # ---- Django API (/wardriving -> wardrive) ----
    # Incluye HTTP REST y WebSocket (mapa/KML vía Daphne ASGI). Sin Upgrade/Connection
    # el handshake ws falla con 400/502.
    location /wardriving/ {
      proxy_set_header Host              $http_host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Prefix /wardriving;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_buffering off;
      proxy_read_timeout 5400;
      proxy_send_timeout 5400;
      # Cuando Django responda redirects internos a /admin/*, se reescriben al prefijo público.
      proxy_redirect ~^/admin/(.*)$ /wardriving/admin/$1;

      proxy_pass http://wardrive_upstream/;
    }

    # ---- Analytics API (/analytics -> analytics service) ----
    location = /analytics {
      return 301 /analytics/;
    }

    location /analytics/ {
      proxy_set_header Host              $http_host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host  $host;
      proxy_set_header X-Forwarded-Prefix /analytics;

      proxy_http_version 1.1;
      proxy_read_timeout 300;
      proxy_send_timeout 300;
      proxy_redirect off;

      proxy_pass http://analytics_upstream/;
    }

    # ---- Teselas de mapa para Metabase (browser → nginx → CARTO, no OSM.org) ----
    # Same-origin: MB_MAP_TILE_SERVER_URL=/map-tiles/{z}/{x}/{y}.png
    location /map-tiles/ {
      proxy_pass https://basemaps.cartocdn.com/light_all/;
      proxy_ssl_server_name on;
      proxy_ssl_name basemaps.cartocdn.com;

      proxy_set_header Host              basemaps.cartocdn.com;
      proxy_set_header User-Agent        "WardrivingPlatform-Metabase/1.0 (map tile cache)";
      proxy_set_header Referer           $scheme://$host/;
      proxy_set_header X-Real-IP         "";
      proxy_set_header X-Forwarded-For   "";
      proxy_set_header Accept-Encoding   "";

      proxy_http_version 1.1;
      proxy_buffering on;
      proxy_hide_header Set-Cookie;
      proxy_ignore_headers Set-Cookie Cache-Control Expires;

      proxy_cache map_tiles;
      proxy_cache_key $uri;
      proxy_cache_valid 200 7d;
      proxy_cache_valid 204 404 1m;
      proxy_cache_lock on;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

      proxy_connect_timeout 10s;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;

      expires 7d;
      add_header Cache-Control "public";
      add_header X-Cache-Status $upstream_cache_status always;
      access_log off;
    }

    # ---- OSM Americana (SPA /ctf/map): style, sprites, fonts, teselas OSM US ----
    location = /map-americana/style.json {
      proxy_pass https://americanamap.org/style.json;
      proxy_ssl_server_name on;
      proxy_ssl_name americanamap.org;
      proxy_set_header Host americanamap.org;
      proxy_set_header User-Agent "WardrivingPlatform/1.0 (Americana style proxy)";
      proxy_set_header Referer $scheme://$host/;
      proxy_http_version 1.1;
      proxy_hide_header Set-Cookie;
      expires 1h;
      add_header Cache-Control "public";
      add_header Access-Control-Allow-Origin *;
    }

    location /map-americana/sprites/ {
      proxy_pass https://americanamap.org/sprites/;
      proxy_ssl_server_name on;
      proxy_ssl_name americanamap.org;
      proxy_set_header Host americanamap.org;
      proxy_set_header User-Agent "WardrivingPlatform/1.0 (Americana sprites proxy)";
      proxy_set_header Referer $scheme://$host/;
      proxy_http_version 1.1;
      proxy_hide_header Set-Cookie;
      expires 7d;
      add_header Cache-Control "public";
    }

    location /map-americana/fonts/ {
      proxy_pass https://font.americanamap.org/;
      proxy_ssl_server_name on;
      proxy_ssl_name font.americanamap.org;
      proxy_set_header Host font.americanamap.org;
      proxy_set_header User-Agent "WardrivingPlatform/1.0 (Americana fonts proxy)";
      proxy_set_header Referer $scheme://$host/;
      proxy_http_version 1.1;
      proxy_hide_header Set-Cookie;
      expires 7d;
      add_header Cache-Control "public";
    }

    location /map-americana/osm-us/ {
      proxy_pass https://tiles.openstreetmap.us/;
      proxy_ssl_server_name on;
      proxy_ssl_name tiles.openstreetmap.us;
      proxy_set_header Host tiles.openstreetmap.us;
      proxy_set_header Origin $scheme://$host;
      proxy_set_header Referer $http_referer;
      proxy_set_header User-Agent $http_user_agent;
      proxy_http_version 1.1;
      proxy_hide_header Set-Cookie;
      proxy_cache map_tiles;
      proxy_cache_key $proxy_host$uri;
      proxy_cache_valid 200 1h;
      proxy_cache_lock on;
      expires 1h;
      add_header Cache-Control "public";
      add_header X-Cache-Status $upstream_cache_status always;
    }

    # ---- Metabase (root → wardrive_bi) ----
    location / {
      proxy_set_header Host              $http_host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_read_timeout 300;
      proxy_send_timeout 300;
      proxy_redirect off;
      proxy_pass http://metabase_upstream/;
    }
  }
}
